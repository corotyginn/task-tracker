<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Мои задачи</h1>

    <form id="task-form">
        <input type="text" id="title" placeholder="Название задачи" required>
        <select id="category">
            <option value="учёба">Учёба</option>
            <option value="работа">Работа</option>
            <option value="личное" selected>Личное</option>
        </select>
        <button type="submit">Добавить</button>
    </form>

    <div id="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="active">Активные</button>
        <button data-filter="completed">Выполненные</button>
    </div>

    <ul id="task-list"></ul>

    <script src="/static/app.js"></script>
</body>
</html>
